<!doctype html>
<html lang="en">
<head>

<style>
html,body{margin:0;height:100%;background:#eef1f8;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#bar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fff;box-shadow:0 1px 4px #0002;z-index:2}
#bar button,#bar select{font-size:15px;padding:5px 9px;border-radius:8px;border:1px solid #bbb;background:#f7f7f7}

</style>
</head>
<body>
<div id="bar">
  <select id="ropes">
    <option value="4">4 ropes</option><option value="5" selected>5 ropes</option><option value="6">6 ropes</option>
    <option value="7">7 ropes</option><option value="8">8 ropes</option><option value="10">10 ropes</option>
  </select>
  <button id="new">New</button>
  <button id="demo" title="Replay the scramble backwards">Demo</button>
  <button id="dbgBtn">🐞</button>
  <a href="v1.html" style="font-size:13px;color:#667">v1</a>
  <span id="info"></span>
</div>
<canvas id="cv"></canvas>
<div id="dbg"></div>
<div id="msg"></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const W = 12;
const D = 16;
const H0 = +Q.get('h0') || 8;
const OMEGA = 0.5;
const ITER = +Q.get('iter') || 8;
const STEP = +Q.get('step') || 3;
const DMAX = +Q.get('dmax') || 4;
const VMAX = 2.5;
const DAMP = 0.9;
const VREST = 0.8;
const VCUT = 0.3;
const G = 64;
const PEG_R = 17;
const POST_R = 25;
const POST_H = 38;
const LIFT = 45;
const CLEARANCE = 38;
const CELL = 32;
const SELF_GAP = +Q.get('self') || 4;
const WARM_EVERY = +Q.get('warm') || 2;
const REFRESH = Q.get('refresh') !== '0';
const MARGIN = +Q.get('margin') || 3;
const COLORS = ['#2e9e3a', '#2f7fe0', '#e0453a', '#f0a020', '#8e44d0', '#18b3b3', '#e05fa8', '#8a5a33', '#b8a800', '#5c6b7a'];

const pairKey = (a, b) => a < b ? a * 64 + b : b * 64 + a;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const mk = (x, y, z) => ({ x, y, z, px: x, py: y, pz: z });

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeBoard(cols, rows) {
  const pegs = [], w = (cols - 1) * G, h = (rows - 1) * G;
  const add = (x, y) => {
    const ox = x === 0 ? -1 : x === w ? 1 : 0, oy = y === 0 ? -1 : y === h ? 1 : 0, l = Math.hypot(ox, oy);
    pegs.push({ x, y, ox: ox / l, oy: oy / l });
  };
  for (let i = 0; i < cols; i++) add(i * G, 0);
  for (let j = 1; j < rows; j++) add(w, j * G);
  for (let i = cols - 2; i >= 0; i--) add(i * G, h);
  for (let j = rows - 2; j >= 1; j--) add(0, j * G);
  return { cols, rows, pegs, w, h };
}

function segX(p1, p2, p3, p4) {
  const d1x = p2.x - p1.x, d1y = p2.y - p1.y, d2x = p4.x - p3.x, d2y = p4.y - p3.y;
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-12) return null;
  const ex = p3.x - p1.x, ey = p3.y - p1.y;
  const t = (ex * d2y - ey * d2x) / den;
  const u = (ex * d1y - ey * d1x) / den;
  if (t < 0 || t >= 1 || u < 0 || u >= 1) return null;
  return [t, u];
}

const CP = { s: 0, t: 0 };
function closestSegSeg(p1, q1, p2, q2) {
  const d1x = q1.x - p1.x, d1y = q1.y - p1.y, d1z = q1.z - p1.z;
  const d2x = q2.x - p2.x, d2y = q2.y - p2.y, d2z = q2.z - p2.z;
  const rx = p1.x - p2.x, ry = p1.y - p2.y, rz = p1.z - p2.z;
  const a = d1x * d1x + d1y * d1y + d1z * d1z, e = d2x * d2x + d2y * d2y + d2z * d2z;
  const f = d2x * rx + d2y * ry + d2z * rz;
  let s, t;
  if (a <= 1e-12 && e <= 1e-12) { s = 0; t = 0; }
  else if (a <= 1e-12) { s = 0; t = clamp01(f / e); }
  else {
    const c = d1x * rx + d1y * ry + d1z * rz;
    if (e <= 1e-12) { t = 0; s = clamp01(-c / a); }
    else {
      const b = d1x * d2x + d1y * d2y + d1z * d2z, den = a * e - b * b;
      s = den > 1e-12 ? clamp01((b * f - c * e) / den) : 0;
      t = (b * s + f) / e;
      if (t < 0) { t = 0; s = clamp01(-c / a); }
      else if (t > 1) { t = 1; s = clamp01((b - c) / a); }
    }
  }
  CP.s = s; CP.t = t;
}

class Engine {
  constructor(cols, rows) {
    this.board = makeBoard(cols, rows);
    this.ropes = [];
    this.held = null;
    this.landing = [];
    this.lastHeld = -1;
    this.sig = new Map();
    this.flags = {};
    this.flagCount = 0;
    this.minDist = Infinity;
    this.maxSpeed = 0;
    this.substeps = 0;
    this.pairCount = 0;
    this.monitorOn = false;
    this.sigDirty = true;
    this.segPool = [];
    this.segN = 0;
    this.blockTop = { x: 0, y: 0, z: 0 };
    this.cellStart = new Int32Array(256);
    this.cellFill = new Int32Array(256);
    this.items = new Int32Array(4096);
    this.cand = new Int32Array(8192);
    this.candN = 0;
    this.act = new Int32Array(4096);
    this.actN = 0;
    this.warm = new Int32Array(4096);
    this.warmN = 0;
    this.drift = Infinity;
    this.winN = 0;
  }

  addRope(pa, pb, color) {
    const A = this.board.pegs[pa], B = this.board.pegs[pb];
    const n = Math.max(2, Math.round(Math.hypot(B.x - A.x, B.y - A.y) / H0));
    const pts = [];
    for (let i = 0; i <= n; i++) { const t = i / n; pts.push(mk(A.x + (B.x - A.x) * t, A.y + (B.y - A.y) * t, 0)); }
    const r = { id: this.ropes.length, color, pts, ends: [pa, pb], cleared: false, fade: 1, s: null, L: 0, h: H0, maxSeg: 0 };
    this.computeArc(r);
    this.ropes.push(r);
  }

  active() { return this.ropes.filter(r => !r.cleared); }
  endIndex(r, e) { return e === 0 ? 0 : r.pts.length - 1; }

  occupied() {
    const s = new Set();
    for (const r of this.ropes) if (!r.cleared) for (const p of r.ends) if (p != null) s.add(p);
    return s;
  }

  ensureSig() {
    if (!this.sigDirty) return;
    this.collectSegs(this.active());
    this.sig = this.signature();
    this.sigDirty = false;
  }

  crossingCount(rid) {
    this.ensureSig();
    let n = 0;
    for (const arr of this.sig.values()) for (const c of arr) if (c.a === rid || c.b === rid) n++;
    return n;
  }

  totalCrossings() {
    this.ensureSig();
    let n = 0;
    for (const arr of this.sig.values()) n += arr.length;
    return n;
  }

  grab(rid, e) {
    const r = this.ropes[rid];
    this.held = { r: rid, e, from: r.ends[e], lifted: false };
    r.ends[e] = null;
    this.lastHeld = rid;
  }

  heldPt() {
    const r = this.ropes[this.held.r];
    return r.pts[this.endIndex(r, this.held.e)];
  }

  heldPos() { const p = this.heldPt(); return { x: p.x, y: p.y }; }

  attach(peg) {
    const r = this.ropes[this.held.r], p = this.heldPt(), P = this.board.pegs[peg];
    r.ends[this.held.e] = peg;
    p.x = p.px = P.x; p.y = p.py = P.y;
    this.landing.push({ p, peg, rope: r.id, wait: 0, top: { x: p.x, y: p.y, z: p.z + 400 } });
    this.held = null;
  }

  computeArc(r) {
    const p = r.pts, s = new Float64Array(p.length);
    let mx = 0;
    for (let i = 1; i < p.length; i++) {
      const l = Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y, p[i].z - p[i - 1].z);
      if (l > mx) mx = l;
      s[i] = s[i - 1] + l;
    }
    r.s = s; r.L = s[p.length - 1]; r.h = r.L / (p.length - 1); r.maxSeg = mx;
  }

  resample(r) {
    const p = r.pts, n = p.length - 1, s = r.s, L = r.L;
    const m = Math.max(2, Math.round(L / H0));
    const out = [p[0]];
    let k = 0;
    for (let j = 1; j < m; j++) {
      const u = L * j / m;
      while (k < n - 1 && s[k + 1] < u) k++;
      const seg = s[k + 1] - s[k], t = seg > 1e-12 ? (u - s[k]) / seg : 0, a = p[k], b = p[k + 1];
      out.push({
        x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t,
        px: a.px + (b.px - a.px) * t, py: a.py + (b.py - a.py) * t, pz: a.pz + (b.pz - a.pz) * t,
      });
    }
    out.push(p[n]);
    r.pts = out;
    this.computeArc(r);
  }

  holeClear(l) {
    const P = this.board.pegs[l.peg], R2 = (POST_R - 2) * (POST_R - 2);
    for (const r of this.ropes) {
      if (r.cleared || r.id === l.rope) continue;
      for (const q of r.pts) {
        const dx = q.x - P.x, dy = q.y - P.y;
        if (dx * dx + dy * dy < R2 && q.z < l.p.z) return false;
      }
    }
    return true;
  }

  holdHeight(p) {
    let m = 0;
    const hr = this.held.r;
    for (const r of this.ropes) {
      if (r.cleared || r.id === hr) continue;
      for (const q of r.pts) {
        if (q.z > m) { const dx = q.x - p.x, dy = q.y - p.y; if (dx * dx + dy * dy < 900) m = q.z; }
      }
    }
    return Math.max(LIFT, m + CLEARANCE);
  }

  substep(target) {
    this.substeps++;
    const act = this.active();
    if (this.held) {
      const p = this.heldPt();
      p.px = p.x; p.py = p.y; p.pz = p.z;
      const zt = this.holdHeight(p);
      p.z = p.z < zt ? Math.min(zt, p.z + STEP) : Math.max(zt, p.z - STEP);
      if (!this.held.lifted && p.z >= LIFT - 1e-9) this.held.lifted = true;
      if (this.held.lifted && target) {
        const dx = target.x - p.x, dy = target.y - p.y, d = Math.hypot(dx, dy);
        if (d > 1e-9) { const s = Math.min(STEP, d); p.x += dx / d * s; p.y += dy / d * s; }
      }
    }
    for (let i = this.landing.length - 1; i >= 0; i--) {
      const l = this.landing[i], p = l.p;
      p.pz = p.z;
      if (l.wait < 40 && !this.holeClear(l)) { l.wait++; continue; }
      p.z = Math.max(0, p.z - STEP);
      if (p.z === 0) this.landing.splice(i, 1);
    }
    for (const r of act) {
      const p = r.pts, n = p.length;
      for (let i = 1; i < n - 1; i++) {
        const q = p[i];
        let vx = (q.x - q.px) * DAMP, vy = (q.y - q.py) * DAMP, vz = (q.z - q.pz) * DAMP;
        const v = Math.hypot(vx, vy, vz);
        if (v > VMAX) { const k = VMAX / v; vx *= k; vy *= k; vz *= k; }
        else if (v < VREST) { const k = v < VCUT ? 0 : (v - VCUT) / (VREST - VCUT); vx *= k; vy *= k; vz *= k; }
        q.px = q.x; q.py = q.y; q.pz = q.z;
        q.x += vx; q.y += vy; q.z += vz;
      }
    }
    this.collectSegs(act);
    this.broadphase((D + MARGIN) / 2 + 1, true);
    this.activePairs();
    const freeRope = this.held ? this.held.r : this.landing.length ? this.lastHeld : -1;
    const postC = this.postCandidates(act, freeRope);
    let minD = Infinity;
    for (let it = 0; it < ITER; it++) {
      if (REFRESH && it === (ITER >> 1)) this.activePairs();
      for (const r of act) {
        const p = r.pts, n = p.length;
        if (it & 1) {
          for (let i = n - 2; i >= 1; i--) {
            const q = p[i], a = p[i - 1], b = p[i + 1];
            q.x += OMEGA * ((a.x + b.x) * 0.5 - q.x); q.y += OMEGA * ((a.y + b.y) * 0.5 - q.y); q.z += OMEGA * ((a.z + b.z) * 0.5 - q.z);
          }
        } else {
          for (let i = 1; i < n - 1; i++) {
            const q = p[i], a = p[i - 1], b = p[i + 1];
            q.x += OMEGA * ((a.x + b.x) * 0.5 - q.x); q.y += OMEGA * ((a.y + b.y) * 0.5 - q.y); q.z += OMEGA * ((a.z + b.z) * 0.5 - q.z);
          }
        }
      }
      this.applyPosts(postC);
      minD = this.solveContacts(false);
      if (it % WARM_EVERY === WARM_EVERY - 1) minD = Math.min(minD, this.solveContacts(true));
    }
    if (minD < this.minDist) this.minDist = minD;
    this.lastMinD = minD;
    if (this.deepLog && minD < 9 && this.deepLog.length < 40) {
      const sa = this.segPool[this.minPair], sb = this.segPool[this.minPairB];
      const pegD = Math.min(...this.board.pegs.map(P => Math.hypot(P.x - sa.a.x, P.y - sa.a.y)));
      this.deepLog.push({ step: this.substeps, d: +minD.toFixed(1), ra: sa.rope.id, ka: sa.k, na: sa.rope.pts.length, rb: sb.rope.id, kb: sb.k, nb: sb.rope.pts.length, held: this.held ? this.held.r + (this.held.lifted ? 'L' : 'u') : null, landing: this.landing.length, last: this.lastHeld, x: Math.round(sa.a.x), y: Math.round(sa.a.y), za: +sa.a.z.toFixed(0), zb: +sb.a.z.toFixed(0), pegD: Math.round(pegD) });
    }
    let maxv = 0;
    for (const r of act) {
      const p = r.pts, n = p.length;
      for (let i = 1; i < n - 1; i++) {
        const q = p[i];
        const dx = q.x - q.px, dy = q.y - q.py, dz = q.z - q.pz, d = Math.hypot(dx, dy, dz);
        if (d > DMAX) { const k = DMAX / d; q.x = q.px + dx * k; q.y = q.py + dy * k; q.z = q.pz + dz * k; }
        if (d > maxv) maxv = d;
      }
      this.computeArc(r);
    }
    this.maxSpeed = maxv;
    if (++this.winN >= 8) {
      this.winN = 0;
      let dr = 0;
      for (const r of act) {
        const p = r.pts;
        for (let i = 1; i < p.length - 1; i++) {
          const q = p[i];
          const d = q.rx === undefined ? 1 : Math.hypot(q.x - q.rx, q.y - q.ry, q.z - q.rz);
          if (d > dr) dr = d;
          q.rx = q.x; q.ry = q.y; q.rz = q.z;
        }
      }
      this.drift = dr;
    }
    if (this.monitorOn) { this.monitor(this.signature()); this.sigDirty = false; } else this.sigDirty = true;
    for (const r of act) if (r.h > 1.25 * H0 || r.h < 0.8 * H0 || r.maxSeg > 1.8 * H0) this.resample(r);
  }

  collectSegs(act) {
    const pool = this.segPool;
    let n = 0;
    const get = () => pool[n] || (pool[n] = { rope: null, k: 0, a: null, b: null, ima: 0, imb: 0, x0: 0, x1: 0, y0: 0, y1: 0, z0: 0, z1: 0, cx: 0, cy: 0, cx1: 0, cy1: 0 });
    for (const r of act) {
      const p = r.pts, m = p.length, h = r.h;
      for (let k = 0; k < m - 1; k++) {
        const s = get();
        s.rope = r; s.k = k; s.a = p[k]; s.b = p[k + 1]; s.ima = k === 0 ? 0 : h; s.imb = k === m - 2 ? 0 : h;
        n++;
      }
    }
    if (this.held) {
      const e = this.heldPt(), top = this.blockTop, s = get();
      top.x = e.x; top.y = e.y; top.z = e.z + 400;
      s.rope = this.ropes[this.held.r]; s.k = -1; s.a = e; s.b = top; s.ima = 0; s.imb = 0;
      n++;
    }
    for (const l of this.landing) {
      const s = get();
      l.top.z = l.p.z + 400;
      s.rope = this.ropes[l.rope]; s.k = -1; s.a = l.p; s.b = l.top; s.ima = 0; s.imb = 0;
      n++;
    }
    this.segN = n;
  }

  broadphase(M, useZ) {
    const pool = this.segPool, n = this.segN;
    let gx0 = Infinity, gy0 = Infinity, gx1 = -Infinity, gy1 = -Infinity;
    for (let i = 0; i < n; i++) {
      const s = pool[i], a = s.a, b = s.b;
      if (a.x < b.x) { s.x0 = a.x - M; s.x1 = b.x + M; } else { s.x0 = b.x - M; s.x1 = a.x + M; }
      if (a.y < b.y) { s.y0 = a.y - M; s.y1 = b.y + M; } else { s.y0 = b.y - M; s.y1 = a.y + M; }
      if (a.z < b.z) { s.z0 = a.z - M; s.z1 = b.z + M; } else { s.z0 = b.z - M; s.z1 = a.z + M; }
      if (s.x0 < gx0) gx0 = s.x0; if (s.x1 > gx1) gx1 = s.x1;
      if (s.y0 < gy0) gy0 = s.y0; if (s.y1 > gy1) gy1 = s.y1;
    }
    this.candN = 0;
    if (!n) return;
    const nx = Math.floor((gx1 - gx0) / CELL) + 1, ny = Math.floor((gy1 - gy0) / CELL) + 1, nc = nx * ny;
    if (this.cellStart.length < nc + 1) { this.cellStart = new Int32Array(nc * 2 + 1); this.cellFill = new Int32Array(nc * 2 + 1); }
    const start = this.cellStart, fill = this.cellFill;
    start.fill(0, 0, nc + 1);
    let total = 0;
    for (let i = 0; i < n; i++) {
      const s = pool[i];
      s.cx = Math.floor((s.x0 - gx0) / CELL); s.cx1 = Math.floor((s.x1 - gx0) / CELL);
      s.cy = Math.floor((s.y0 - gy0) / CELL); s.cy1 = Math.floor((s.y1 - gy0) / CELL);
      for (let cy = s.cy; cy <= s.cy1; cy++) for (let cx = s.cx; cx <= s.cx1; cx++) { start[cy * nx + cx + 1]++; total++; }
    }
    for (let c = 0; c < nc; c++) { start[c + 1] += start[c]; fill[c] = start[c]; }
    if (this.items.length < total) this.items = new Int32Array(total * 2);
    const items = this.items;
    for (let i = 0; i < n; i++) {
      const s = pool[i];
      for (let cy = s.cy; cy <= s.cy1; cy++) for (let cx = s.cx; cx <= s.cx1; cx++) items[fill[cy * nx + cx]++] = i;
    }
    let cand = this.cand, cn = 0;
    for (let c = 0; c < nc; c++) {
      const e = start[c + 1], cxc = c % nx, cyc = (c - cxc) / nx;
      for (let p = start[c]; p < e; p++) {
        const i = items[p], si = pool[i];
        for (let q = p + 1; q < e; q++) {
          const j = items[q], sj = pool[j];
          if (si.rope === sj.rope && (si.k < 0 || sj.k < 0 || sj.k - si.k < SELF_GAP)) continue;
          if (si.x1 < sj.x0 || sj.x1 < si.x0 || si.y1 < sj.y0 || sj.y1 < si.y0) continue;
          if (useZ && (si.z1 < sj.z0 || sj.z1 < si.z0)) continue;
          if ((si.cx > sj.cx ? si.cx : sj.cx) !== cxc || (si.cy > sj.cy ? si.cy : sj.cy) !== cyc) continue;
          if (cn + 2 > cand.length) { const g = new Int32Array(cand.length * 2); g.set(cand); cand = this.cand = g; }
          cand[cn++] = i; cand[cn++] = j;
        }
      }
    }
    this.candN = cn;
    this.pairCount = cn / 2;
  }

  activePairs() {
    const pool = this.segPool, cand = this.cand, cn = this.candN, lim2 = (D + MARGIN) * (D + MARGIN);
    if (this.act.length < cn) { this.act = new Int32Array(cn * 2); this.warm = new Int32Array(cn * 2); }
    const act = this.act, warm = this.warm, hot2 = (D + 1) * (D + 1);
    let an = 0, wn = 0;
    for (let i = 0; i < cn; i += 2) {
      const sa = pool[cand[i]], sb = pool[cand[i + 1]];
      const a1 = sa.a, a2 = sa.b, b1 = sb.a, b2 = sb.b;
      closestSegSeg(a1, a2, b1, b2);
      const s = CP.s, t = CP.t;
      const nx = a1.x + (a2.x - a1.x) * s - b1.x - (b2.x - b1.x) * t;
      const ny = a1.y + (a2.y - a1.y) * s - b1.y - (b2.y - b1.y) * t;
      const nz = a1.z + (a2.z - a1.z) * s - b1.z - (b2.z - b1.z) * t;
      const d2 = nx * nx + ny * ny + nz * nz;
      if (d2 < hot2) { act[an++] = cand[i]; act[an++] = cand[i + 1]; }
      else if (d2 < lim2) { warm[wn++] = cand[i]; warm[wn++] = cand[i + 1]; }
    }
    this.actN = an;
    this.warmN = wn;
    this.activeCount = an / 2;
  }

  solveContacts(useWarm) {
    const pool = this.segPool, act = useWarm ? this.warm : this.act, an = useWarm ? this.warmN : this.actN;
    let minD = Infinity;
    for (let i = 0; i < an; i += 2) {
      const sa = pool[act[i]], sb = pool[act[i + 1]];
      const a1 = sa.a, a2 = sa.b, b1 = sb.a, b2 = sb.b;
      closestSegSeg(a1, a2, b1, b2);
      const s = CP.s, t = CP.t;
      let nx = a1.x + (a2.x - a1.x) * s - b1.x - (b2.x - b1.x) * t;
      let ny = a1.y + (a2.y - a1.y) * s - b1.y - (b2.y - b1.y) * t;
      let nz = a1.z + (a2.z - a1.z) * s - b1.z - (b2.z - b1.z) * t;
      const d2 = nx * nx + ny * ny + nz * nz;
      if (d2 >= D * D) { if (d2 < minD) minD = d2; continue; }
      const d = Math.sqrt(d2);
      if (d2 < minD) { minD = d2; this.minPair = act[i]; this.minPairB = act[i + 1]; }
      if (d < 1e-6) { nx = 0; ny = 0; nz = a1.z + a2.z >= b1.z + b2.z ? 1 : -1; }
      else { nx /= d; ny /= d; nz /= d; }
      const wa1 = (1 - s) * sa.ima, wa2 = s * sa.imb, wb1 = (1 - t) * sb.ima, wb2 = t * sb.imb;
      const den = wa1 * (1 - s) + wa2 * s + wb1 * (1 - t) + wb2 * t;
      if (den < 1e-12) continue;
      const lam = (D - d) / den;
      a1.x += nx * lam * wa1; a1.y += ny * lam * wa1; a1.z += nz * lam * wa1;
      a2.x += nx * lam * wa2; a2.y += ny * lam * wa2; a2.z += nz * lam * wa2;
      b1.x -= nx * lam * wb1; b1.y -= ny * lam * wb1; b1.z -= nz * lam * wb1;
      b2.x -= nx * lam * wb2; b2.y -= ny * lam * wb2; b2.z -= nz * lam * wb2;
    }
    return Math.sqrt(minD);
  }

  postCandidates(act, freeRope) {
    const pegs = this.board.pegs, bw = this.board.w, bh = this.board.h, R = POST_R + DMAX + 2;
    const posts = [...this.occupied()];
    if (this.held && !this.held.lifted) posts.push(this.held.from);
    const out = [];
    for (const r of act) {
      const p = r.pts, n = p.length, free = r.id === freeRope;
      for (let i = 1; i < n - 1; i++) {
        const q = p[i];
        if (q.x > R && q.x < bw - R && q.y > R && q.y < bh - R) continue;
        for (const pi of posts) {
          if (pi === r.ends[0] || pi === r.ends[1]) continue;
          if (free && this.held && pi === this.held.from) continue;
          const P = pegs[pi];
          let t = (q.x - P.x) * P.ox + (q.y - P.y) * P.oy;
          t = t < 0 ? 0 : t > 200 ? 200 : t;
          const rx = q.x - P.x - P.ox * t, ry = q.y - P.y - P.oy * t;
          if (rx * rx + ry * ry < R * R) out.push(q, P, free);
        }
      }
    }
    return out;
  }

  applyPosts(list) {
    const R = POST_R;
    for (let i = 0; i < list.length; i += 3) {
      const q = list[i], P = list[i + 1];
      if (list[i + 2] && q.z >= POST_H) continue;
      let t = (q.x - P.x) * P.ox + (q.y - P.y) * P.oy;
      t = t < 0 ? 0 : t > 200 ? 200 : t;
      const rx = q.x - P.x - P.ox * t, ry = q.y - P.y - P.oy * t, d = Math.hypot(rx, ry);
      if (d >= R) continue;
      const pen = R - d, push = pen < 2 ? pen : 2;
      let dx = rx - P.ox * pen * 0.5, dy = ry - P.oy * pen * 0.5;
      const l = Math.hypot(dx, dy);
      if (l < 1e-9) { dx = -P.ox; dy = -P.oy; } else { dx /= l; dy /= l; }
      q.x += dx * push; q.y += dy * push;
    }
  }

  signature() {
    const sig = new Map();
    this.broadphase(1, false);
    const pool = this.segPool, cand = this.cand, cn = this.candN;
    for (let i = 0; i < cn; i += 2) {
      let sa = pool[cand[i]], sb = pool[cand[i + 1]];
      if (sa.k < 0 || sb.k < 0 || sa.rope === sb.rope) continue;
      if (sa.rope.id > sb.rope.id) { const t = sa; sa = sb; sb = t; }
      const hit = segX(sa.a, sa.b, sb.a, sb.b);
      if (!hit) continue;
      const A = sa.rope, B = sb.rope, tA = hit[0], tB = hit[1];
      const za = sa.a.z + (sa.b.z - sa.a.z) * tA, zb = sb.a.z + (sb.b.z - sb.a.z) * tB;
      const c = {
        a: A.id, b: B.id, over: za >= zb ? A.id : B.id, dz: za - zb,
        x: sa.a.x + (sa.b.x - sa.a.x) * tA, y: sa.a.y + (sa.b.y - sa.a.y) * tA,
        ua: A.s[sa.k] + (A.s[sa.k + 1] - A.s[sa.k]) * tA, ub: B.s[sb.k] + (B.s[sb.k + 1] - B.s[sb.k]) * tB,
        La: A.L, Lb: B.L,
      };
      const key = pairKey(A.id, B.id);
      let arr = sig.get(key);
      if (!arr) sig.set(key, arr = []);
      arr.push(c);
    }
    for (const arr of sig.values()) arr.sort((p, q) => p.ua - q.ua);
    return sig;
  }

  flag(kind, O, N) {
    this.flags[kind] = (this.flags[kind] || 0) + 1; this.flagCount++;
    const f = c => ({ a: c.a, b: c.b, over: c.over, dz: +c.dz.toFixed(2), x: +c.x.toFixed(1), y: +c.y.toFixed(1), ua: +c.ua.toFixed(1), La: +c.La.toFixed(1), ub: +c.ub.toFixed(1), Lb: +c.Lb.toFixed(1) });
    if (!this.flagLog) this.flagLog = [];
    if (this.flagLog.length < 20) this.flagLog.push({ kind, step: this.substeps, held: this.held && { ...this.held }, lastHeld: this.lastHeld, landing: this.landing.length, O: O.map(f), N: N.map(f) });
  }

  legalEdit(O, N) {
    const n = O.length, m = N.length, memo = new Map();
    const free = this.held ? this.held.r : this.lastHeld;
    const go = (i, j) => {
      if (i === n && j === m) return true;
      const key = i * 64 + j;
      if (memo.has(key)) return memo.get(key);
      let ok = false;
      if (i < n && j < m && O[i].over === N[j].over) ok = go(i + 1, j + 1);
      if (!ok && i < n && O[i].over === free) ok = go(i + 1, j);
      if (!ok && j < m && N[j].over === free) ok = go(i, j + 1);
      if (!ok && i + 1 < n && O[i].over === O[i + 1].over) ok = go(i + 2, j);
      if (!ok && j + 1 < m && N[j].over === N[j + 1].over) ok = go(i, j + 2);
      memo.set(key, ok);
      return ok;
    };
    return go(0, 0);
  }

  monitor(sig) {
    const keys = new Set([...this.sig.keys(), ...sig.keys()]);
    const byB = arr => arr.slice().sort((p, q) => p.ub - q.ub);
    for (const key of keys) {
      const O = this.sig.get(key) || [], N = sig.get(key) || [];
      if (this.legalEdit(O, N) || this.legalEdit(byB(O), byB(N))) continue;
      this.flag(O.length === N.length ? 'flip' : 'illegal', O, N);
    }
    this.sig = sig;
  }

  clearFree(minStreak) {
    const cleared = [];
    for (const r of this.active()) {
      if (r.ends[0] == null || r.ends[1] == null || this.crossingCount(r.id) > 0) { r.zeroN = 0; continue; }
      r.zeroN = (r.zeroN || 0) + 1;
      if (r.zeroN >= minStreak) { r.cleared = true; r.fade = 1; cleared.push(r.id); }
    }
    return cleared;
  }
}

// ---------- generation ----------

function sizeFor(n) {
  return { 4: [4, 5], 5: [4, 6], 6: [5, 6], 7: [5, 7], 8: [6, 7], 9: [6, 8], 10: [7, 8] }[n] || [5, 6];
}

function settle(E, max = 800, eps = 0.1) {
  E.drift = Infinity; E.winN = 0;
  for (let i = 0; i < max; i++) {
    E.substep(null);
    if (E.drift < eps && !E.landing.length) return i;
  }
  E.unsettled = (E.unsettled || 0) + 1;
  return max;
}

function insetPoint(E, P, d) {
  const cx = E.board.w / 2, cy = E.board.h / 2;
  const dx = cx - P.x, dy = cy - P.y, l = Math.hypot(dx, dy);
  return { x: P.x + dx / l * d, y: P.y + dy / l * d };
}

function simulateMove(E, rid, e, toPeg, quick) {
  const A = E.board.pegs[E.ropes[rid].ends[e]], B = E.board.pegs[toPeg];
  E.grab(rid, e);
  const path = [insetPoint(E, A, 24), insetPoint(E, B, 24), { x: B.x, y: B.y }];
  let guard = 0;
  for (const T of path) {
    while (guard++ < 20000) {
      E.substep(T);
      const c = E.heldPt();
      if (E.held.lifted && Math.hypot(T.x - c.x, T.y - c.y) < 1e-6) break;
    }
  }
  E.attach(toPeg);
  if (quick) settle(E, 120, 0.4); else settle(E);
}

function generate(seed, nRopes, kMoves, monitor) {
  const rand = mulberry32(seed);
  const [cols, rows] = sizeFor(nRopes);
  const E = new Engine(cols, rows);
  const M = E.board.pegs.length;
  const idx = [...Array(M).keys()];
  for (let i = M - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const chosen = idx.slice(0, 2 * nRopes).sort((a, b) => a - b);
  const shift = rand() < 0.5 ? 0 : 1;
  const colors = COLORS.slice();
  for (let i = colors.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [colors[i], colors[j]] = [colors[j], colors[i]]; }
  for (let i = 0; i < nRopes; i++) E.addRope(chosen[(2 * i + shift) % chosen.length], chosen[(2 * i + 1 + shift) % chosen.length], colors[i % colors.length]);
  E.monitorOn = !!monitor;
  settle(E);
  E.flags = {}; E.flagCount = 0;
  const moves = [];
  const doMove = rid => {
    const r = E.ropes[rid], e = rand() < 0.5 ? 0 : 1;
    const occ = E.occupied();
    const free = [...Array(M).keys()].filter(p => !occ.has(p));
    const to = free[Math.floor(rand() * free.length)];
    moves.push({ r: rid, e, from: r.ends[e], to });
    simulateMove(E, rid, e, to, true);
  };
  for (let m = 0; m < kMoves; m++) doMove(Math.floor(rand() * nRopes));
  for (let extra = 0; extra < 3 * nRopes; extra++) {
    const zero = E.ropes.filter(r => E.crossingCount(r.id) === 0);
    if (!zero.length) break;
    doMove(zero[Math.floor(rand() * zero.length)].id);
  }
  settle(E);
  E.monitorOn = !!monitor;
  E.ensureSig();
  return { E, moves, par: moves.length };
}

// ---------- UI ----------

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const info = document.getElementById('info'), dbgEl = document.getElementById('dbg'), msgEl = document.getElementById('msg');
let E = null, game = null, phase = 'idle', pointer = null, dragPath = [], queue = [], targetPeg = null, heldFrom = null;
let paused = false, dropTarget = null;
let moves = 0, settleN = 0, debug = false, demo = null, view = { s: 1, ox: 0, oy: 0 }, dpr = 1, frameMs = 0, subPerFrame = 0, runCount = 0;
const MAXSUB = 60, IDLE_SUB = 10;
let physMs = 0, renderMs = 0, subMs = 0, budgetMs = 8;

function newGame() {
  msgEl.style.display = 'none';
  const n = +document.getElementById('ropes').value;
  const t0 = performance.now();
  game = generate((Math.random() * 2 ** 31) | 0, n, n);
  game.genMs = performance.now() - t0;
  E = game.E;
  E.monitorOn = debug;
  moves = 0; phase = 'idle'; demo = null; queue = []; paused = false;
  layout();
}

function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight - 48;
  cv.width = cw * dpr; cv.height = ch * dpr; cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  if (!E) return;
  const M = PEG_R + 10, bw = E.board.w + 2 * M, bh = E.board.h + 2 * M;
  const s = Math.min(cw / bw, ch / bh);
  view = { s, ox: (cw - bw * s) / 2 + M * s, oy: (ch - bh * s) / 2 + M * s };
}

function toBoard(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left - view.ox) / view.s, y: (ev.clientY - r.top - view.oy) / view.s };
}

function clampBoard(p) {
  return { x: Math.max(0, Math.min(E.board.w, p.x)), y: Math.max(0, Math.min(E.board.h, p.y)) };
}

function freePegNear(p, rad) {
  const occ = E.occupied();
  let best = null, bd = rad * rad;
  E.board.pegs.forEach((P, i) => {
    if (occ.has(i)) return;
    const d = (P.x - p.x) ** 2 + (P.y - p.y) ** 2;
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}

cv.addEventListener('pointerdown', ev => {
  if (!E || demo || paused || (phase !== 'idle' && phase !== 'settling') || E.landing.length) return;
  const p = toBoard(ev);
  let best = null, bd = (PEG_R * 1.5) ** 2;
  for (const r of E.active()) for (const e of [0, 1]) {
    const peg = r.ends[e];
    if (peg == null) continue;
    const P = E.board.pegs[peg], d = (P.x - p.x) ** 2 + (P.y - p.y) ** 2;
    if (d < bd) { bd = d; best = [r.id, e, peg]; }
  }
  if (!best) return;
  cv.setPointerCapture(ev.pointerId);
  E.grab(best[0], best[1]);
  heldFrom = best[2];
  pointer = clampBoard(p);
  dragPath = [{ ...E.board.pegs[heldFrom] }];
  phase = 'held';
});

cv.addEventListener('pointermove', ev => {
  if (phase !== 'held') return;
  pointer = clampBoard(toBoard(ev));
  const l = dragPath[dragPath.length - 1];
  if (Math.hypot(pointer.x - l.x, pointer.y - l.y) > 3) dragPath.push({ ...pointer });
});

const release = () => {
  if (phase !== 'held') return;
  const peg = freePegNear(pointer, PEG_R * 1.6);
  if (peg != null) { queue = [{ ...pointer }, { ...E.board.pegs[peg] }]; targetPeg = peg; dropTarget = { ...E.board.pegs[peg] }; }
  else { queue = dragPath.slice().reverse(); targetPeg = heldFrom; dropTarget = null; }
  phase = 'moving';
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

function advance(target, budget) {
  let used = 0;
  const t0 = performance.now();
  while (used < budget) {
    if (used >= 2 && performance.now() - t0 > budgetMs) break;
    const c = E.heldPt();
    if (E.held.lifted && Math.hypot(target.x - c.x, target.y - c.y) < 1e-3) return { reached: true, used };
    E.substep(target);
    used++;
  }
  return { reached: false, used };
}

function relax(target) {
  const t0 = performance.now();
  let used = 0;
  while (used < IDLE_SUB) {
    if (used >= 2 && performance.now() - t0 > budgetMs) break;
    E.substep(target);
    used++;
  }
  return used;
}

function startDemo() {
  if (!game || phase !== 'idle' || paused) return;
  demo = game.moves.slice().reverse();
  nextDemo();
}

function nextDemo() {
  if (!demo) return;
  while (demo.length) {
    const m = demo.shift();
    const r = E.ropes[m.r];
    if (r.cleared || r.ends[m.e] !== m.to) continue;
    E.grab(m.r, m.e);
    heldFrom = m.to;
    queue = [insetPoint(E, E.board.pegs[m.to], 24), insetPoint(E, E.board.pegs[m.from], 24), { ...E.board.pegs[m.from] }];
    targetPeg = m.from;
    phase = 'moving';
    return;
  }
  demo = null;
}

function tick() {
  const t0 = performance.now();
  let subs = 0;
  if (E && paused) render();
  else if (E) {
    if (phase === 'held') {
      const r = advance(pointer, MAXSUB);
      subs += r.used;
      if (r.reached) subs += relax(pointer);
    } else if (phase === 'moving') {
      let budget = demo ? 12 : MAXSUB;
      while (queue.length && budget > 0) {
        const r = advance(queue[0], budget);
        budget -= r.used; subs += r.used;
        if (r.reached) queue.shift(); else break;
      }
      if (!queue.length) {
        E.attach(targetPeg);
        if (targetPeg !== heldFrom) moves++;
        phase = 'settling'; settleN = 0; E.drift = Infinity; E.winN = 0;
      }
    } else if (phase === 'settling') {
      subs += relax(null);
      settleN++;
      if (!E.landing.length) {
        const done = E.drift < 0.15 || settleN > 240;
        if (E.clearFree(done ? 1 : 4).length) { E.drift = Infinity; E.winN = 0; settleN = 0; }
        else if (done) { phase = 'idle'; if (demo) nextDemo(); }
        if (!E.active().length) { phase = 'idle'; showWin(); }
      }
    }
    for (const r of E.ropes) if (r.cleared && r.fade > 0) r.fade = Math.max(0, r.fade - 0.05);
    const t1 = performance.now();
    render();
    const t2 = performance.now();
    physMs = physMs * 0.9 + (t1 - t0) * 0.1;
    renderMs = renderMs * 0.9 + (t2 - t1) * 0.1;
    if (subs) subMs = subMs * 0.9 + (t1 - t0) / subs * 0.1;
    budgetMs = Math.max(4, Math.min(11, 14 - renderMs));
  }
  frameMs = frameMs * 0.9 + (performance.now() - t0) * 0.1;
  subPerFrame = subPerFrame * 0.9 + subs * 0.1;
  requestAnimationFrame(tick);
}

function showWin() {
  const par = game.par, stars = moves <= par ? 3 : moves <= par + 2 ? 2 : 1;
  msgEl.innerHTML = `${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}<br><small>${moves} moves · par ${par}</small>`;
  msgEl.style.display = 'block';
  demo = null;
}

const EXT = 0.75;

function runPath(r, k0, k1) {
  const p = r.pts, n = p.length;
  ctx.beginPath();
  if (k0 === 0) ctx.moveTo(p[0].x, p[0].y);
  else {
    const a = p[k0 - 1], b = p[k0], l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    ctx.moveTo((a.x + b.x) / 2 - (b.x - a.x) / l * EXT, (a.y + b.y) / 2 - (b.y - a.y) / l * EXT);
  }
  for (let k = k0; k <= k1; k++) ctx.lineTo(p[k].x, p[k].y);
  if (k1 < n - 1) {
    const a = p[k1], b = p[k1 + 1], l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    ctx.lineTo((a.x + b.x) / 2 + (b.x - a.x) / l * EXT, (a.y + b.y) / 2 + (b.y - a.y) / l * EXT);
  }
}

function drawRopes(list) {
  const pieces = [];
  for (const r of list) {
    const p = r.pts;
    for (let k = 0; k < p.length; k++) pieces.push({ r, k, z: Math.round(p[k].z) });
  }
  pieces.sort((a, b) => a.z - b.z || a.r.id - b.r.id || a.k - b.k);
  ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
  let i = 0, runs = 0;
  while (i < pieces.length) {
    let j = i;
    const r = pieces[i].r, z = pieces[i].z;
    while (j + 1 < pieces.length && pieces[j + 1].r === r && pieces[j + 1].z === z && pieces[j + 1].k === pieces[j].k + 1) j++;
    runPath(r, pieces[i].k, pieces[j].k);
    ctx.strokeStyle = '#1d2230'; ctx.lineWidth = W + 3; ctx.stroke();
    ctx.strokeStyle = r.color; ctx.lineWidth = W; ctx.stroke();
    runs++;
    i = j + 1;
  }
  runCount = runs;
}

function render() {
  const cw = cv.width / dpr, ch = cv.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#eef1f8'; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
  const occ = new Map();
  for (const r of E.active()) r.ends.forEach(p => { if (p != null) occ.set(p, r); });
  const hover = phase === 'held' ? freePegNear(pointer, PEG_R * 1.6) : null;
  E.board.pegs.forEach((P, i) => {
    ctx.beginPath(); ctx.arc(P.x, P.y, PEG_R, 0, Math.PI * 2);
    if (occ.has(i)) { ctx.fillStyle = occ.get(i).color; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d2230'; ctx.stroke(); }
    else { ctx.fillStyle = i === hover ? '#b9c3e6' : '#d6dbee'; ctx.fill(); }
  });
  for (const r of E.ropes) if (r.cleared && r.fade > 0) {
    ctx.globalAlpha = r.fade; drawRopes([r]); ctx.globalAlpha = 1;
  }
  const act = E.active();
  drawRopes(act);
  for (const r of act) for (const e of [0, 1]) {
    let p = r.pts[E.endIndex(r, e)];
    const held = E.held && E.held.r === r.id && E.held.e === e;
    const handle = !held || demo ? null : phase === 'held' ? pointer : phase === 'moving' ? dropTarget : null;
    if (handle && Math.hypot(handle.x - p.x, handle.y - p.y) > 1) {
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(handle.x, handle.y);
      ctx.strokeStyle = '#1d2230'; ctx.lineWidth = W + 3; ctx.stroke();
      ctx.strokeStyle = r.color; ctx.lineWidth = W; ctx.stroke();
      p = handle;
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, held ? PEG_R * 0.95 : W * 0.75, 0, Math.PI * 2);
    if (held) { ctx.shadowColor = '#0006'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4; }
    ctx.fillStyle = r.color; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d2230'; ctx.stroke();
  }
  if (debug) {
    for (const arr of E.sig.values()) for (const c of arr) {
      ctx.beginPath(); ctx.arc(c.x, c.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = E.ropes[c.over].color; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = '#fff'; ctx.stroke();
    }
  }
  info.textContent = `Moves ${moves} · Par ${game.par}` + (E.active().length ? '' : ' ✓');
  if (debug) {
    const parts = E.active().reduce((n, r) => n + r.pts.length, 0);
    dbgEl.textContent = `frame ${frameMs.toFixed(1)}ms = physics ${physMs.toFixed(1)} + draw ${renderMs.toFixed(1)}   steps/frame ${subPerFrame.toFixed(0)}   ${subMs.toFixed(2)}ms/step\n` +
      `particles ${parts}  contacts ${E.activeCount}  runs ${runCount}  dpr ${dpr}\n` +
      `crossings ${E.totalCrossings()}  min gap ${E.minDist.toFixed(1)}  flags ${E.flagCount}  gen ${(game.genMs || 0).toFixed(0)}ms\n` +
      Object.entries(E.flags).map(([k, v]) => `${k}:${v}`).join('  ');
  } else dbgEl.textContent = '';
}

document.getElementById('new').onclick = newGame;
document.getElementById('demo').onclick = startDemo;
document.getElementById('dbgBtn').onclick = () => { debug = !debug; if (E) { E.ensureSig(); E.monitorOn = debug; } };
window.addEventListener('resize', layout);

window.T = {
  generate, simulateMove, settle, Engine,
  get E() { return E; },
  get state() { return { phase, moves, view, active: E.active().length, crossings: E.totalCrossings(), flags: E.flags, minDist: E.minDist, landing: E.landing.length }; },
  pegScreen(i) { const P = E.board.pegs[i]; return { x: view.ox + P.x * view.s, y: 48 + view.oy + P.y * view.s }; },
  show(eng, par) { E = eng; game = { E, par: par || 0, genMs: 0, moves: [] }; paused = true; phase = 'idle'; layout(); },
  play(g) { E = g.E; game = g; E.monitorOn = debug; paused = false; phase = 'idle'; moves = 0; layout(); },
  zoom(x, y, s) { view.s = s; view.ox = innerWidth / 2 - x * s; view.oy = (innerHeight - 48) / 2 - y * s; },
  setDebug(v) { debug = v; if (E) { E.ensureSig(); E.monitorOn = v; } },
  tightest(eng) {
    const cs = [];
    for (const a of eng.sig.values()) for (const c of a) cs.push(c);
    let best = null;
    for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
      const d = Math.hypot(cs[i].x - cs[j].x, cs[i].y - cs[j].y);
      if (!best || d < best.d) best = { d, x: (cs[i].x + cs[j].x) / 2, y: (cs[i].y + cs[j].y) / 2 };
    }
    return best;
  },
  clusters(eng, rad) {
    const cs = [];
    for (const a of eng.sig.values()) for (const c of a) cs.push(c);
    const out = [];
    for (const c of cs) {
      const near = cs.filter(d => Math.hypot(d.x - c.x, d.y - c.y) < rad);
      const ropes = new Set();
      for (const d of near) { ropes.add(d.a); ropes.add(d.b); }
      out.push({ x: c.x, y: c.y, n: near.length, ropes: ropes.size });
    }
    out.sort((p, q) => q.ropes - p.ropes || q.n - p.n);
    return out;
  },
  run(seeds, n, k) {
    const rows = [];
    for (const seed of seeds) {
      const t0 = performance.now();
      const g = generate(seed, n, k, true);
      const t1 = performance.now();
      const genFlags = { ...g.E.flags }, crossings = g.E.totalCrossings();
      const zero = g.E.ropes.filter(r => g.E.crossingCount(r.id) === 0).length;
      const genMin = g.E.minDist, genSub = g.E.substeps, genUnsettled = g.E.unsettled || 0;
      for (const m of g.moves.slice().reverse()) simulateMove(g.E, m.r, m.e, m.from);
      const bad = g.E.ropes.some(r => r.pts.some(p => !isFinite(p.x) || !isFinite(p.z)));
      rows.push({
        seed, genMs: Math.round(t1 - t0), solveMs: Math.round(performance.now() - t1), moves: g.moves.length, genSub,
        crossings, zero, genFlags, flags: g.E.flags, genMin, minDist: g.E.minDist, genUnsettled, unsettled: g.E.unsettled || 0,
        remaining: g.E.totalCrossings(), bad,
      });
    }
    return rows;
  },
};

layout();
newGame();
requestAnimationFrame(tick);
</script>
